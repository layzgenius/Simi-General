name: HF Space keep-alive

on:
  schedule:
    - cron: '0 12 * * *'   # noon UTC daily — safe interval, won't trigger HF abuse detection
  workflow_dispatch:         # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://layzskolah-simi-audio-analyzer.hf.space/health)
          echo "Health status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
